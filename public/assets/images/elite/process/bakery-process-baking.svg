<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="t"><title id="t">Baked loaf of bread fresh from the oven</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf3e7"/><stop offset="1" stop-color="#f8e3d2"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#e0661c"/></radialGradient></defs>
<rect width="640" height="720" fill="url(#bg)"/>
<!-- oven -->
<rect x="70" y="90" width="300" height="320" rx="26" fill="#3b2a20" stroke="#24180f" stroke-width="6"/>
<rect x="100" y="150" width="240" height="200" rx="16" fill="url(#glow)" stroke="#24180f" stroke-width="5"/>
<rect x="110" y="300" width="220" height="10" rx="5" fill="#24180f" opacity=".6"/>
<path d="M150 300 q70 -70 140 0 z" fill="#b8642a" stroke="#6e3b12" stroke-width="4"/>
<g fill="#c86e31"><circle cx="120" cy="120" r="9"/><circle cx="155" cy="120" r="9"/><circle cx="190" cy="120" r="9"/></g>
<rect x="250" y="112" width="90" height="16" rx="8" fill="#6e3b12"/>
<!-- heat waves -->
<g stroke="#d9944f" stroke-width="6" stroke-linecap="round" fill="none" opacity=".75"><path d="M440 160 q15 -20 0 -40 q-15 -20 0 -40"/><path d="M490 180 q15 -20 0 -40 q-15 -20 0 -40"/><path d="M540 160 q15 -20 0 -40 q-15 -20 0 -40"/></g>
<!-- board -->
<rect x="150" y="580" width="420" height="26" rx="12" fill="#a5561f"/>
<!-- loaf -->
<path d="M190 580 v-90 q0 -90 100 -90 h120 q100 0 100 90 v90 z" fill="#c8732f" stroke="#6e3b12" stroke-width="6" stroke-linejoin="round"/>
<path d="M200 500 q0 -80 90 -80 h120 q90 0 90 80" fill="none" stroke="#e8a265" stroke-width="10" stroke-linecap="round" opacity=".6"/>
<g stroke="#6e3b12" stroke-width="5" stroke-linecap="round"><path d="M270 450 l30 -30"/><path d="M330 450 l30 -30"/><path d="M390 450 l30 -30"/></g>
<!-- slices -->
<g transform="translate(470 470)"><rect x="0" y="0" width="90" height="110" rx="30" fill="#c8732f" stroke="#6e3b12" stroke-width="5"/><rect x="10" y="12" width="70" height="88" rx="22" fill="#fbe7c8"/></g>
<!-- stars -->
<g fill="#c86e31"><path d="M480 300 l8 16 18 3 -13 12 3 18 -16 -9 -16 9 3 -18 -13 -12 18 -3z"/><path d="M560 360 l6 12 13 2 -9 9 2 13 -12 -6 -12 6 2 -13 -9 -9 13 -2z"/></g>
<rect y="640" width="640" height="80" fill="#6e3b12" opacity=".12"/>
</svg>
